defaults:
  - _self_

monitor:
  metric: "val/acc_top1"
  mode: "max"

modalities: ["nmr", "ehr", "olink"]
candidate_idx: 2

nmr:
  mlp:
    hidden_dims: [1024,2048,4096]
    hidden_dropouts: [0.2, 0.2, 0.2]
ehr:
  mlp:
    hidden_dims: [1024,2048,4096]
    hidden_dropouts: [0.6, 0.6, 0.6]
olink:
  mlp:
    hidden_dims: [1024,2048,4096]
    hidden_dropouts: [0.2, 0.2, 0.2]
