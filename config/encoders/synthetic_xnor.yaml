defaults:
  - _self_

monitor:
  metric: "val/acc_top1"
  mode: "max"

n_modalities: 3

# dataset feature layout: 1d -> (B, D), 2d -> (B, S, D_token)
feature_layout: "1d"
seq_len: 16

# encoder input layout: 1d uses MLP, 2d uses small transformer + mean pooling
input_layout: "1d"
sequence_encoder_params:
  nhead: 2
  num_layers: 2
  dropout: 0.0
  dim_feedforward_mult: 1
  layer_type: "transformer"   # transformer / tokenwise_mlp / uniform_attention

input_dim: 128
n_samples: 30000

# for feature_layout=1d: per-modality feature dim D
# for feature_layout=2d: per-token feature dim D_token (effective dim = seq_len * D_token)
dims_modality: [128, 128, 128]

n_bits: 16

# - xnor_only: A carries only (xor/xnor)(u,v) bits; B carries u; C carries v (original setup).
# - u_v_uv: A carries [u, v, (xor/xnor)(u,v)] and B/C are structured so that B⊙C = [u, v, (xor/xnor)(u,v)].
embed_mode: "u_v_uv"

# keep real signal (0.5 kills info completely)
# for n_modalities=2 use one entry (e.g. [0.0])
#p_flips: [0.0]
p_flips: [0.0, 0.0]

# corruption probabilities
# for n_modalities=2 use two entries (A,B), for n_modalities=3 use three (A,B,C)
#p_corrs: [0.0, 0.5]
p_corrs: [0.0, 1.0, 1.0]

# use misleading corruption (not gaussian) so the standard model gets pulled the wrong way
corr_modes: "swap_signal"  # "swap_signal"

# Optional: make B/C corruption mutually exclusive (per sample).
# If enabled and `bc_corr_p` is null, this expects `p_corrs[1] == p_corrs[2]` and uses that value.
bc_corr_exclusive: true
bc_corr_p: null
bc_corr_split: 0.5

# Optional (bimodal only, n_modalities=2): make A/B corruption mutually exclusive (per sample).
# If enabled and `ab_corr_p` is null, this expects `p_corrs[0] == p_corrs[1]` and uses that value.
ab_corr_exclusive: true
ab_corr_p: 0.5
ab_corr_split: 0.5

# make SNR low so the model can't just ignore corruption implicitly
signal_scale: 1.0
distractor_std: 3.0

a_rule: "xnor"
