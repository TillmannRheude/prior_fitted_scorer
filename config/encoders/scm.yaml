monitor:
  metric: "val/acc_top1"
  mode: "max"

n_modalities: 3
type: identity

n_latents: 8
latent_dim: 16
embedding_dim: 128

edge_probability: 0.3
latent_noise_std: 0.2
modality_noise_std: [0.4, 0.4, 0.4]
modality_readout: linear
modality_readout_alpha: 1.0
modality_mlp_hidden_dim: null
parameter_sampling_mode: static
n_latents_choices: [32]
latent_dim_choices: [16]
modality_noise_std_choices: [0.3]
modality_readout_alpha_choices: [0.2, 0.5, 0.8]
edge_probability_choices: [0.3, 0.4]

modality_mask_mode: structured
modality_connection_probability: 0.5
shared_all_mode: null
pairwise_mode: null
semantic_root_fraction: 0.125

modality_allocation_mode: static
modality_allocation_choices:
  - shared_all: 0.25
    pairwise: 0.375
    private: 0.375
  - shared_all: 0.1
    pairwise: 0.45
    private: 0.45
modality_allocation:
  shared_all: 0.25
  pairwise: 0.375
  private: 0.375
modality_allocation_preset: null

mechanism_types_mode: static
mechanism_type_choices:
  - [linear]
  - [linear, tanh, sine]
  - [linear, relu, gelu]
  - [tanh, sine, gelu]
  - [relu, gelu, mlp]
mechanism_types:
  - linear
  - tanh
  - sine
  - relu
  - gelu
  - mlp
  - multiplicative
shared_modality_projections: true
shared_projection_seed: null
