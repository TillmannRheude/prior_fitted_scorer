modelname: mlp

emb_dim: 128

negative_sampling: pair
candidate_dependent: true
logit_scale_init: 0.0
embedding_norm: true
bias_init_mult: 1.0

mlp_params:
  hidden_dims: null  # Optional explicit list; otherwise repeat hidden_dim.
  hidden_dim: 512
  num_layers: 2
  dropout: 0.0
  activation: gelu  # gelu / relu / silu
  include_missingness: true
  use_residual: false

pair_num_negatives: 128
scorer_lr: null
scorer_warmup_start_epoch: 0
scorer_warmup_epochs: 0
scorer_warmup_curve: cosine  # cosine / linear / constant
freeze_scorer: false
compile_scorer: false
compile_scorer_mode: default  # default / reduce-overhead / max-autotune

pretrained_scorer_ckpt: null
pretrained_scorer_strict: true
pretrained_load_logit_scale: false
